const D={"name": "独立して3年後2", "file": "063_独立して3年後_完成2", "dur": 1971.86665625, "segs": [], "subs": [{"t": 0.0, "x": "今回ご紹介するスレッドはこちら"}, {"t": 2.566666666666667, "x": "「会社を辞めて独立したワイら、\n3年後どうなったか報告してけ」"}, {"t": 2.566666666666667, "x": "「会社を辞めて独立したワイら、\n3年後どうなったか報告してけ」"}, {"t": 7.75, "x": "独立や起業の話は、始めるときの景気のいい話ばかりが目立ちます。\nところが、その3年後にどうなったのかという報告は、\nなかなか表に出てきません。"}, {"t": 18.816666666666666, "x": "統計で見ると、起業後の生存率は1年後で95.3パーセント、\n3年後で88.1パーセント、5年後では81.7パーセントとされています。\n5年で5社に1社は市場から退出している計算です。"}, {"t": 34.13333333333333, "x": "今回は、実際に会社を辞めて独立した住人たちが、\n収入と手取り、そして辞めてから分かったことを\n正直に書き込んだスレをのぞいてみましょう。"}, {"t": 43.96666666666667, "x": "それでは、早速見ていきましょう"}, {"t": 47.483333333333334, "x": "スレ主や 41歳で\n3年前に会社を辞めた"}, {"t": 47.483333333333334, "x": "「会社を辞めて独立したワイら、3年後どうなったか報告してけ」"}, {"t": 51.65, "x": "今はウェブの制作を一人でやっとる"}, {"t": 54.2, "x": "売上は増えたけど\n手元に残る金は思ったより増えてない"}, {"t": 58.36666666666667, "x": "ワイ47歳 会社員のままで\n経理を20年やっとる"}, {"t": 62.86666666666667, "x": "その手元に残らん理由\n数字で説明できると思うで"}, {"t": 66.9, "x": "ワイ33歳\n独立を考えとる会社員や"}, {"t": 70.55, "x": "辞める前に 現実を知りたくて来た"}, {"t": 73.45, "x": "ワイ52歳 独立5年目やけど\n途中で一度潰した"}, {"t": 77.96666666666667, "x": "潰して会社員に戻って\nもう一回出た口や"}, {"t": 81.55, "x": "ワイ38歳 独立2年目やけど\n今年で畳む予定や"}, {"t": 86.25, "x": "一番聞きたくない話をしに来た"}, {"t": 88.88333333333334, "x": "私44歳です 夫が独立して\n私が家計を支えています"}, {"t": 94.43333333333334, "x": "家族の側から見た話ができます"}, {"t": 97.18333333333334, "x": "この6人が揃うスレは\nなかなか無いやろな"}, {"t": 100.45, "x": "まず 世の中の数字を出しとくで"}, {"t": 103.16666666666667, "x": "生存率のやつですね"}, {"t": 105.01666666666667, "x": "起業後の生存率は\n1年後で95.3%や"}, {"t": 109.41666666666667, "x": "95%なら 高い気がしますけど"}, {"t": 112.76666666666667, "x": "3年後で88.1%\n5年後で81.7%になる"}, {"t": 118.56666666666666, "x": "5年で2割が消えるという事やな"}, {"t": 121.08333333333333, "x": "そうや ただ\nこの数字は法人が中心や"}, {"t": 124.58333333333333, "x": "ここで、\n独立したあとの生存率を見ておきましょう。"}, {"t": 128.25, "x": "起業後の生存率は1年後で95.3パーセント、\n3年後で88.1パーセント、\n5年後で81.7パーセントとされています。"}, {"t": 138.2, "x": "5年で5社に1社が退出する計算です。\nただしこれは法人を含む企業全体の数字で、生き残ることと\n生活が成り立つことは別だという点に注意が必要です。"}, {"t": 149.8, "x": "個人事業やと\nもっと厳しいはずやな"}, {"t": 152.81666666666666, "x": "正確な区分の数字は出しにくい\nただ 感覚としてはそうや"}, {"t": 157.48333333333332, "x": "ワイは3年目やから\nぎりぎり生き残っとる側か"}, {"t": 161.05, "x": "統計の上ではな\nただ 生存と成功は別や"}, {"t": 164.88333333333333, "x": "その違いは 何ですか"}, {"t": 167.0, "x": "店や事業が続いとるのと\n生活が成り立っとるのは別という事や"}, {"t": 171.83333333333334, "x": "ワイがまさにそれや\n2年続いたけど生活が持たん"}, {"t": 175.63333333333333, "x": "ほな ワイの数字を出すわ"}, {"t": 177.78333333333333, "x": "売上と 経費と 手取りの順で頼む"}, {"t": 181.06666666666666, "x": "去年の売上が980万や"}, {"t": 183.8, "x": "980万ですか\n会社員時代より多いですよね"}, {"t": 187.95, "x": "会社員の時は額面620万やった"}, {"t": 191.21666666666667, "x": "売上だけ見れば\n1.5倍を超えとるな"}, {"t": 194.35, "x": "そこで喜んどったのが\n1年目のワイや"}, {"t": 197.48333333333332, "x": "経費はいくらや"}, {"t": 198.83333333333334, "x": "280万や\n機材と外注と交通費と通信費で"}, {"t": 203.21666666666667, "x": "残りが700万ですね"}, {"t": 205.28333333333333, "x": "そこからが本番や\n社会保険と税が来る"}, {"t": 208.61666666666667, "x": "国民健康保険が年52万\n国民年金が年21万や"}, {"t": 213.66666666666666, "x": "そこは全額 自分で払うからな"}, {"t": 216.45, "x": "会社員なら\n厚生年金は労使折半で会社が半分出す"}, {"t": 220.95, "x": "自営は\n半分出してくれる会社が無いという事ですか"}, {"t": 224.88333333333333, "x": "そういう事や\n同じ額を稼いでも 引かれ方が違う"}, {"t": 229.08333333333334, "x": "そこに所得税と住民税と\n事業税が乗る"}, {"t": 232.66666666666666, "x": "合わせていくらになった"}, {"t": 234.36666666666667, "x": "去年の税と社会保険で\n合計190万や"}, {"t": 238.23333333333332, "x": "700万から190万を引くと\n510万ですね"}, {"t": 242.6, "x": "そこが手取りや\n会社員時代の手取りは470万やった"}, {"t": 247.08333333333334, "x": "40万しか増えてないんか"}, {"t": 249.25, "x": "そうや 売上は1.5倍で\n手取りは1割も増えてない"}, {"t": 253.45, "x": "では、\nその売上が手取りになるまでを追ってみましょう。"}, {"t": 256.8833333333333, "x": "売上980万円から経費280万円を引いて\n700万円。\nそこから社会保険と税で190万円が出ていきます。"}, {"t": 266.51666666666665, "x": "残った手取りは510万円。会社員時代の手取り470万円と比べて、\n増えたのは40万円だけでした。会社が負担していた分が、\nそのまま自分に乗るためです。"}, {"t": 278.85, "x": "その差は 何なんですか"}, {"t": 280.96666666666664, "x": "会社が負担しとった分が\n全部自分に乗ったからや"}, {"t": 284.8333333333333, "x": "うちも同じでした\n収入は増えたのに生活は変わらない"}, {"t": 288.96666666666664, "x": "そこが独立で\n一番よく誤解される部分や"}, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
