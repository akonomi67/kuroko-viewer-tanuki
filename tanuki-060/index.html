<title>1000万の10年後2</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;

.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:#000;border-radius:10px;overflow:hidden;position:relative;line-height:0;

.stage img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.62);color:#fff;

.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:76px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}
.marks i{position:absolute;top:0;width:1px;height:7px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--dim);padding:7px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.row{display:flex;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:46px;flex:none;padding-top:1px}
.row span{white-space:pre-wrap;flex:1}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
  max-height:46vh;overflow:auto;padding:2px}
.thumbs figure{margin:0;cursor:pointer;border-radius:7px;overflow:hidden;
  border:2px solid transparent;position:relative;background:#000;aspect-ratio:16/9}
.thumbs figure.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs em{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-size:11px;font-style:normal;padding:1px 6px;border-radius:0 6px 0 0}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}
  .bar button{padding:8px 10px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
