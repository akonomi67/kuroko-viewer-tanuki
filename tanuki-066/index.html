const D={"name": "一発逆転で溶かした民2", "file": "066_一発逆転で溶かした民_完成2", "dur": 1933.26665625, "segs": [], "subs": [{"t": 0.0, "x": "今回ご紹介するスレッドはこちら"}, {"t": 2.566666666666667, "x": "「一発逆転を狙って溶かしたワイら、\nその後どうなったか報告してけ」"}, {"t": 2.566666666666667, "x": "「一発逆転を狙って溶かしたワイら、\nその後どうなったか報告してけ」"}, {"t": 8.1, "x": "資産形成の話では、\nコツコツ積み立てる方法が正しいとされています。\n頭では分かっていても、一気に増やしたいという気持ちは、\n多くの人の中にあります。"}, {"t": 19.2, "x": "そして実際に大きく張った人の話は、\nうまくいった側ばかりが表に出てきます。溶かした側が、\nその後どうなったのかを語ることは、ほとんどありません。"}, {"t": 30.183333333333334, "x": "今回は、一発逆転を狙って大きく減らした住人たちが、\nその額とその後を正直に書き込んだスレをのぞいて\nみましょう。"}, {"t": 38.516666666666666, "x": "それでは、早速見ていきましょう"}, {"t": 42.03333333333333, "x": "スレ主や 38歳で\n部品メーカーの生産管理をしとる"}, {"t": 42.03333333333333, "x": "「一発逆転を狙って溶かしたワイら、その後どうなったか報告してけ」"}, {"t": 46.766666666666666, "x": "5年前に信用取引で\n620万溶かした"}, {"t": 50.78333333333333, "x": "今どうなっとるかを\n正直に書きに来た"}, {"t": 53.56666666666667, "x": "ワイ45歳\n金融機関で長く数字を見てきた側や"}, {"t": 57.766666666666666, "x": "その620万\nどういう入り方をしたか教えてくれるか"}, {"t": 62.06666666666667, "x": "最初は現金で80万から始めた\nそれが2年で240万になった"}, {"t": 67.6, "x": "ワイ31歳\n今まさに含み損を抱えとる側や"}, {"t": 71.51666666666667, "x": "230万入れて\n今150万まで減っとる"}, {"t": 75.35, "x": "ワイ52歳 20年前に800万溶かして\nそこから立て直した"}, {"t": 80.58333333333333, "x": "今は資産が2900万ある\nその話ができると思う"}, {"t": 84.88333333333334, "x": "ワイ41歳\n暗号資産で430万溶かした"}, {"t": 89.06666666666666, "x": "税の扱いを知らんかったのが\n一番痛かった"}, {"t": 92.61666666666666, "x": "私36歳です\n夫が溶かした側の家族として来ました"}, {"t": 97.56666666666666, "x": "本人ではない立場の話ができます"}, {"t": 100.45, "x": "家族の話は\n一番聞くのがつらいやつやな"}, {"t": 103.91666666666667, "x": "ただ\n今日はそこも聞いたほうがええと思う"}, {"t": 106.91666666666667, "x": "続きを話すと 240万になった\n時にワイは自分を天才やと思った"}, {"t": 112.68333333333334, "x": "そこや\n誰でもそこで一回おかしくなる"}, {"t": 115.8, "x": "そこから信用取引に手を出した\n借りて買う形やな"}, {"t": 119.9, "x": "自己資金の何倍まで\n買えるんですか"}, {"t": 122.85, "x": "制度上は3倍前後まで\n買える形になる"}, {"t": 126.28333333333333, "x": "ワイは240万を元手に\n700万分の建玉を持った"}, {"t": 130.91666666666666, "x": "それは 落ちたら一瞬やな"}, {"t": 133.15, "x": "一瞬やった\n相場が2割下がって 追証が来た"}, {"t": 137.03333333333333, "x": "追証というのは 何ですか"}, {"t": 139.38333333333333, "x": "担保が足りんくなって\n追加で金を入れろという連絡や"}, {"t": 143.3, "x": "期限までに入れんと\n強制的に決済される"}, {"t": 146.73333333333332, "x": "そこで現金を入れてまうのが\n一番あかんパターンや"}, {"t": 150.41666666666666, "x": "入れてもうた\n貯金から180万入れた"}, {"t": 153.71666666666667, "x": "その時\n家族には言っていたんですか"}, {"t": 156.66666666666666, "x": "言うてない\n妻には最後まで黙っとった"}, {"t": 159.66666666666666, "x": "そこが2つ目の失敗やな"}, {"t": 161.83333333333334, "x": "結局 その後も下がって\n全部で620万溶かした"}, {"t": 166.5, "x": "620万は 何年分の貯金ですか"}, {"t": 169.93333333333334, "x": "ワイの年収の1年半分や\n8年かけて貯めた分やった"}, {"t": 174.33333333333334, "x": "8年が 3か月で消えたんやな"}, {"t": 177.13333333333333, "x": "正確には 4か月や"}, {"t": 179.3, "x": "ここで 数字の話を1つ置いとくで"}, {"t": 182.33333333333334, "x": "お願いします"}, {"t": 183.6, "x": "相場が50%下がった時\n元に戻すには何%必要やと思う"}, {"t": 189.16666666666666, "x": "50%やないんですか"}, {"t": 191.35, "x": "100%必要になる\n半分になったものを倍にせなあかんからな"}, {"t": 196.18333333333334, "x": "そこは 言われて初めて気付いた"}, {"t": 198.75, "x": "下げと戻しは 対称やない"}, {"t": 201.11666666666667, "x": "ワイはそこで\n取り返そうとして深みにはまった"}, {"t": 204.6, "x": "ここで、数字の性質を1つ確かめておきましょう。"}, {"t": 208.26666666666668, "x": "相場が50パーセント下がったとき、元に戻すには\n100パーセント上げる必要があります。半分に\nなったものを倍にしなければならないからです。"}, {"t": 218.01666666666668, "x": "下げと戻しは対称ではありません。\nだから損を取り返そうとした時点で、\n必要な上げ幅が跳ね上がってしまいます。"}, {"t": 225.78333333333333, "x": "ワイもや 800万のうち500万は\n取り返そうとして増えた損や"}, {"t": 230.73333333333332, "x": "最初の損より\n後の損のほうが大きいんですか"}, {"t": 234.28333333333333, "x": "そうなる\n冷静さを失った状態で張るからな"}, {"t": 237.78333333333333, "x": "損を取り返そうとする行動が\n一番危ない"}, {"t": 241.23333333333332, "x": "夫も同じことを言っていました"}, {"t": 243.58333333333334, "x": "ワイも\n半分になってから倍のリスクを取った"}, {"t": 246.93333333333334, "x": "そこで全部消える人が多い"}, {"t": 249.05, "x": "ワイは そこで妻にばれた"}, {"t": 251.23333333333332, "x": "どうやって 分かったんですか"}, {"t": 253.55, "x": "証券会社からの郵便を 妻が開けた"}, {"t": 256.35, "x": "うちも同じや 郵便で終わった"}, {"t": 258.9, "x": "うちは通帳を見て 気付きました"}, {"t": 261.6, "x": "その時 どうなるんですか"}, {"t": 263.85, "x": "最初は 何も言えませんでした\n声も出なかったです"}, {"t": 267.93333333333334, "x": "うちは3日 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
